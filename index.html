<!doctype html>
<html lang="uk">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#000000">
    <meta name="description" content="Офлайн музична медіатека для вашої музики.">
    <meta name="google-client-id" content="911469273892-hr4arur7kth3pjor37djpvp9fsduk6k1.apps.googleusercontent.com">
    <meta name="google-drive-api-key" content="AIzaSyDz9azxvUUMs5Jqp-W34IRFZrCUeG46HCY">

    <title>Музика</title>
    <link rel="manifest" href="./manifest.webmanifest">
    <link rel="icon" href="./assets/icon.svg" type="image/svg+xml">
    <link rel="apple-touch-icon" href="./assets/icon.png">
    <link rel="stylesheet" href="./styles.css">
  </head>
  <body>
    <div class="app-shell">
      <main id="content" class="content" aria-live="polite"></main>
      <div id="pull-refresh" class="pull-refresh" aria-hidden="true" role="status" aria-live="polite">
        <svg class="pull-refresh-spinner" viewBox="0 0 44 44" aria-hidden="true">
          <g stroke="currentColor" stroke-linecap="round" stroke-width="6">
            <line x1="22" y1="4" x2="22" y2="10" opacity=".24" />
            <line x1="34.7" y1="9.3" x2="30.5" y2="13.5" opacity=".33" />
            <line x1="40" y1="22" x2="34" y2="22" opacity=".42" />
            <line x1="34.7" y1="34.7" x2="30.5" y2="30.5" opacity=".51" />
            <line x1="22" y1="40" x2="22" y2="34" opacity=".60" />
            <line x1="9.3" y1="34.7" x2="13.5" y2="30.5" opacity=".69" />
            <line x1="4" y1="22" x2="10" y2="22" opacity=".78" />
            <line x1="9.3" y1="9.3" x2="13.5" y2="13.5" opacity=".88" />
          </g>
        </svg>
        <span class="pull-refresh-label visually-hidden">Потягніть вниз для оновлення</span>
      </div>

      <section id="mini-player" class="mini-player" aria-label="Мініплеєр"></section>
      <nav id="tab-bar" class="tab-bar" aria-label="Основна навігація"></nav>
      <div id="toast" class="toast" role="status" aria-live="polite"></div>
      <div id="modal-root"></div>
      <input id="audio-import" type="file" accept="audio/*" multiple hidden>
      <audio id="audio-element" preload="metadata"></audio>
    </div>
    <script src="./app.js" defer></script>
  </body>
</html>
