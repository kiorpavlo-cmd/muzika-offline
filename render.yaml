services:
  - type: web
    name: muzika-download-api-kiorpavlo
    runtime: docker
    plan: 0.5c-512mb
    region: frankfurt
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    healthCheckPath: /api/health
    autoDeployTrigger: commit
    disk:
      name: muzika-download-usage
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: MUZIKA_USAGE_FILE
        value: /var/data/monthly-usage.json
      - key: GOOGLE_CLIENT_ID
        value: 911469273892-hr4arur7kth3pjor37djpvp9fsduk6k1.apps.googleusercontent.com
      - key: GOOGLE_ALLOWED_EMAIL
        sync: false
